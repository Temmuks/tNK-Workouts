<!DOCTYPE html>
<html lang="en" xmlns="http:/thymeleafe.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide">
    <title>tNK Workouts</title>
</head>

<body>
    <h1 id="header">tNK-workouts!</h1>
    <div class="container text-center">
        <div class="row align-items-center justify-content-center">
                <div id="loginArea" class="col-md-12">
                    <form method="post" th:action="@{/new-login}" th:object="${user}">
                        <h2>Welcome!</h2>
                        <label>Username:<br> <input type="text" th:field="*{userName}" class="input"></label><br>
                        <label>Password:<br> <input type="password" th:field="*{password}" class="input"></label>
                        <input type="submit" value="Start working out" id="loginBtn">
                    </form>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
